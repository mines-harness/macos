services:
  control:
    image: ${MINES_CONTROL_IMAGE:?Build and set an image containing the workspace and dependencies}
    command: ["node", "infra/mines-control/src/main.ts"]
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      DATABASE_URL: postgres://mines:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres/mines
      MINES_AUTH_URL: ${MINES_AUTH_URL:?Set the public HTTPS account origin}
      MINES_AUTH_SECRET: ${MINES_AUTH_SECRET:?Set a random secret with at least 32 characters}
      MINES_ALLOWED_ORIGINS: ${MINES_ALLOWED_ORIGINS:?Set allowed client origins}
      MINES_SMTP_HOST: ${MINES_SMTP_HOST:-}
      MINES_SMTP_PORT: ${MINES_SMTP_PORT:-25}
      MINES_SMTP_FROM: ${MINES_SMTP_FROM:-}
      MINES_SMTP_USER: ${MINES_SMTP_USER:-}
      MINES_SMTP_PASSWORD: ${MINES_SMTP_PASSWORD:-}
      MINES_EXPO_PUSH_ACCESS_TOKEN: ${MINES_EXPO_PUSH_ACCESS_TOKEN:-}
    ports:
      - "127.0.0.1:8788:8788"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mines
      POSTGRES_DB: mines
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - devices:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mines"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
  stun:
    image: coturn/coturn:4.18.0-r0-alpine
    command:
      - --stun-only
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-tcp
      - --listening-port=3478
      - --log-file=/dev/null
      - --no-stdout-log
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
    mem_limit: 64m
    cpus: 0.25
volumes:
  devices:
